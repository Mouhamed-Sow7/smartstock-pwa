<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SmartstockPwa</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1b2d" />
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartStock" />
    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>

    <!--
      Panneau de debug temporaire — PAS actif par défaut.
      Activation : ouvrir l'URL avec ?debug=1 une fois dans Safari (le flag est
      sauvé en localStorage, donc persiste ensuite dans le PWA déjà installé
      sur l'écran d'accueil, même sans reconnexion réseau à ce moment précis).
      Désactivation : ?debug=0, ou effacer les données du site.
      Objectif : voir en un coup d'oeil (via une simple capture d'écran, sans
      Mac ni Web Inspector) la vraie valeur de safe-area-inset-bottom, la
      hauteur de viewport réelle, et si l'app est bien détectée en mode
      standalone — pour diagnostiquer la bande noire iOS sans debug distant.
    -->
    <script>
      (function () {
        try {
          var params = new URLSearchParams(location.search);
          if (params.has('debug')) {
            localStorage.setItem('ss_debug', params.get('debug') === '0' ? '0' : '1');
          }
          if (localStorage.getItem('ss_debug') !== '1') return;

          var box = document.createElement('div');
          box.style.cssText =
            'position:fixed;left:8px;right:8px;bottom:8px;z-index:999999;' +
            'background:rgba(0,0,0,.88);color:#0f0;font:11px/1.5 monospace;' +
            'padding:8px 10px;border-radius:8px;white-space:pre-wrap;' +
            'pointer-events:none;max-height:45vh;overflow:auto;';
          document.body.appendChild(box);

          var probe = document.createElement('div');
          probe.style.cssText =
            'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);' +
            'padding-bottom:env(safe-area-inset-bottom,0px);' +
            'visibility:hidden;';
          document.body.appendChild(probe);

          function update() {
            var cs = getComputedStyle(probe);
            var rootVars = getComputedStyle(document.documentElement);
            var bottomNav = document.querySelector('.bottom-nav');
            var navRect = bottomNav ? bottomNav.getBoundingClientRect() : null;
            var vv = window.visualViewport;
            var lines = [
              '=== SmartStock debug (?debug=0 pour désactiver) ===',
              'standalone (iOS) : ' + (window.navigator.standalone === true),
              'display-mode standalone : ' + window.matchMedia('(display-mode: standalone)').matches,
              'env(safe-area-inset-top)    : ' + cs.paddingTop,
              'env(safe-area-inset-bottom) : ' + cs.paddingBottom,
              '--safe-bot (CSS var)        : ' + rootVars.getPropertyValue('--safe-bot').trim(),
              'window.innerHeight  : ' + window.innerHeight,
              'document.documentElement.clientHeight : ' + document.documentElement.clientHeight,
              'visualViewport.height : ' + (vv ? vv.height : 'n/a'),
              'visualViewport.offsetTop : ' + (vv ? vv.offsetTop : 'n/a'),
              'screen.height (physique) : ' + window.screen.height,
              'devicePixelRatio : ' + window.devicePixelRatio,
            ];
            if (navRect) {
              lines.push('--- .bottom-nav ---');
              lines.push('bottom-nav.bottom (bas de l\'élément) : ' + navRect.bottom.toFixed(1));
              lines.push('window.innerHeight - bottom-nav.bottom : ' + (window.innerHeight - navRect.bottom).toFixed(1) + '  (devrait être ~0)');
            } else {
              lines.push('.bottom-nav introuvable sur cette page (normale si login/admin)');
            }
            box.textContent = lines.join('\n');
          }

          update();
          setInterval(update, 1000);
          window.addEventListener('resize', update);
          if (window.visualViewport) window.visualViewport.addEventListener('resize', update);

          // Console complète (eruda) en plus du panneau texte — utile si besoin
          // d'inspecter des éléments ou exécuter du JS directement sur le téléphone.
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/npm/eruda';
          s.onload = function () { window.eruda && window.eruda.init(); };
          document.body.appendChild(s);
        } catch (e) { /* ne jamais casser l'app pour du debug */ }
      })();
    </script>
  </body>
</html>

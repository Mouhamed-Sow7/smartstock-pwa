<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SmartstockPwa</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1b2d" />
    <!--
      Anti-FOUC thème : applique data-theme AVANT le premier paint, avant même
      qu'Angular ne démarre. Sans ce script, le CSS :root (sombre) s'affiche
      un instant à chaque chargement/refresh le temps qu'Angular bootstrap,
      charge le module de la route, construise un composant qui injecte
      ThemeService, et exécute son constructeur -> flash sombre visible,
      perçu comme "l'app démarre en sombre" même quand le thème clair est
      actif. Logique identique à ThemeService (clé localStorage "ss_theme",
      clair par défaut si rien de sauvegardé) : à maintenir en synchro si
      ThemeService change.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ss_theme');
          if (saved !== 'dark') {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          // localStorage indisponible (navigation privée, quota...) -> on
          // laisse le thème sombre par défaut du CSS, ThemeService reprendra
          // la main normalement une fois Angular démarré.
        }
      })();
    </script>
    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmartStock" />
    <!-- Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Icône d'installation iOS (Ajouter à l'écran d'accueil) : sans ce lien explicite,
         iOS ignore les icônes du manifest.webmanifest et prend une capture d'écran de
         la page comme icône. Même glyphe que le logo de la page login. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&amp;display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
